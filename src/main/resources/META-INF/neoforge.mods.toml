modLoader="javafml"

loaderVersion="[4,)"

license="MIT"

[[mods]]

modId="battlefield_ops"

version="0.8.36"

displayName="战地风云 · Battlefield Ops"

authors="Local development"

description='''征服 / 突破计分、地图划线编辑器、据点与出生点、双方活动区域；TaCZ 配装按部署发放，卓越前线载具按白名单部署。'''



[[dependencies.battlefield_ops]]

modId="neoforge"

type="required"

versionRange="[21.1.233,21.2)"

ordering="NONE"

side="BOTH"



[[dependencies.battlefield_ops]]

modId="minecraft"

type="required"

versionRange="[1.21.1,1.21.2)"

ordering="NONE"

side="BOTH"



# Both are optional and probed at runtime. If either is missing the catalogue reports it in-game

# instead of failing to load, and only the matching kit / vehicle entries disappear.

[[dependencies.battlefield_ops]]

modId="tacz"

type="optional"

versionRange="[1.1.0,)"

ordering="NONE"

side="BOTH"



[[dependencies.battlefield_ops]]

modId="superbwarfare"

type="optional"

versionRange="[0.8.0,)"

ordering="NONE"

side="BOTH"



# Registers the one mixin this mod ships. Kept separate from the jar manifest so the mixin config is

# discoverable by reading the mod metadata rather than by inspecting the archive.

[[mixins]]

config="battlefield_ops.mixins.json"


[[mixins]]
config="battlefield_ops.crawl.mixins.json"

# The HUD is a separate client mod. Declared optional so a client without it still loads: everything this mod
# draws itself (kill feed, objectives, markers) keeps working, and the HUD widgets simply never appear.
[[dependencies.battlefield_ops]]
modId="modernhud"
type="optional"
versionRange="[1.0.0,)"
ordering="AFTER"
side="CLIENT"

# Same for the equipment mod whose items fill the tactical slots.
[[dependencies.battlefield_ops]]
modId="lrtactical"
type="optional"
versionRange="[0.4.0,)"
side="BOTH"

# The support items are drawn with GeckoLib geometry, so the client needs it.
[[dependencies.battlefield_ops]]
modId="geckolib"
type="required"
versionRange="[4.0.0,)"
side="CLIENT"
